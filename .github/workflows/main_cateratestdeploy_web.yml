name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://cateraapi.azurewebsites.net
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure static website is enabled
        env:
          AZURE_FRONTEND_STORAGE_ACCOUNT: ${{ vars.AZURE_FRONTEND_STORAGE_ACCOUNT || secrets.AZURE_FRONTEND_STORAGE_ACCOUNT }}
        run: |
          az storage blob service-properties update `
            --account-name "cpstoragecatera" `
            --static-website `
            --index-document index.html `
            --404-document index.html `
            --auth-mode login

      - name: Clear previous frontend assets
        env:
          AZURE_FRONTEND_STORAGE_ACCOUNT: ${{ vars.AZURE_FRONTEND_STORAGE_ACCOUNT || secrets.AZURE_FRONTEND_STORAGE_ACCOUNT }}
        run: |
          az storage blob delete-batch `
            --account-name "cpstoragecatera" `
            --source '$web' `
            --auth-mode login

      - name: Upload frontend assets
        env:
          AZURE_FRONTEND_STORAGE_ACCOUNT: ${{ vars.AZURE_FRONTEND_STORAGE_ACCOUNT || secrets.AZURE_FRONTEND_STORAGE_ACCOUNT }}
        run: |
          az storage blob upload-batch `
            --account-name "cpstoragecatera" `
            --destination '$web' `
            --source frontend/dist `
            --overwrite `
            --auth-mode login
